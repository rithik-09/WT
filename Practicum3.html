<!DOCTYPE html>
<html>
<head>
    <title>AIoT Nexus - Personal Details</title>
</head>
<body>

    <h2>AIoT Nexus - Step 1: Personal Information</h2>

    <form action="page2.html" method="get">
        <table>
            <tr>
                <td>First Name:</td>
                <td><input type="text" name="firstName"></td>
            </tr>
            <tr>
                <td>Last Name:</td>
                <td><input type="text" name="lastName"></td>
            </tr>
            <tr>
                <td>Gender:</td>
                <td>
                    <input type="radio" name="gender" value="male"> Male
                    <input type="radio" name="gender" value="female"> Female
                    <input type="radio" name="gender" value="other"> Other
                </td>
            </tr>
            <tr>
                <td colspan="2"><b>Address</b></td>
            </tr>
            <tr>
                <td>Number &amp; Street:</td>
                <td><input type="text" name="street"></td>
            </tr>
            <tr>
                <td>City:</td>
                <td><input type="text" name="city"></td>
            </tr>
            <tr>
                <td>State:</td>
                <td><input type="text" name="state"></td>
            </tr>
            <tr>
                <td>Zip Code:</td>
                <td><input type="text" name="zipCode"></td>
            </tr>
            <tr>
                <td>Phone:</td>
                <td>
                    <input type="tel" name="phone">
                </td>
            </tr>
            <tr>
                <td>E-mail Address:</td>
                <td><input type="email" name="email" placeholder="name@domain.com"></td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <input type="submit" value="Next: Schedule Demo">
                    <input type="reset" value="Clear">
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
