<!DOCTYPE html>
<html>
<head>
    <title>AIoT Nexus - Appointment Details</title>
</head>
<body>

    <h2>AIoT Nexus - Step 2: Schedule & Industry Setup</h2>

    <form action="page3.html" method="get">
        <table>
            <tr>
                <td>Demo Date:</td>
                <td><input type="date" name="demoDate"></td>
            </tr>
            <tr>
                <td>Preferred Time:</td>
                <td><input type="time" name="demoTime"></td>
            </tr>
            <tr>
                <td>Industry Type:</td>
                <td><input type="text" name="industryType"></td>
            </tr>
            <tr>
                <td>Device ID / Asset Code:</td>
                <td><input type="text" name="assetCode"></td>
            </tr>
            <tr>
                <td><b>AIoT Integration Details:</b></td>
                <td>
                    <textarea name="requirements" rows="4" cols="30" placeholder="Enter your request here"></textarea>
                </td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <input type="submit" value="Next: Confirmation">
                    <input type="reset" value="Clear">
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
